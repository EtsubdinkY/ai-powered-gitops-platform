name: Terraform Validation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: [self-hosted, platform-runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/75857734333/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-deployer@project-ff80b6ff-8c4e-4127-89e.iam.gserviceaccount.com

      - name: Terraform fmt
        run: terraform -chdir=terraform/environments/dev fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform/environments/dev init

      - name: Terraform validate
        run: terraform -chdir=terraform/environments/dev validate

      - name: AI Risk Reviewer
        run: python3 cloud-risk-cost-reviewer/reviewer.py

      - name: Terraform plan
        run: terraform -chdir=terraform/environments/dev plan